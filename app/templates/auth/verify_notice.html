{% extends "base.html" %}
{% block title %}Verify your email — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card mx-auto text-center">
  <div class="fs-1 mb-2">📧</div>
  <h2 class="mb-2">Check your inbox</h2>
  <p class="text-muted mb-4">
    We've sent a verification link to your email address. Click it to activate
    your account and unlock the dashboard.
  </p>
  <a href="{{ url_for('auth.resend_verification') }}" class="btn btn-outline-primary">
    Didn't get it? Resend email
  </a>
</div>
{% endblock %}
